name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXTAUTH_URL: https://storr.github.io/TechTronicsDeals
      NEXT_PUBLIC_BASE_URL: https://storr.github.io/TechTronicsDeals

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXTAUTH_URL: https://storr.github.io/TechTronicsDeals
          NEXT_PUBLIC_BASE_URL: https://storr.github.io/TechTronicsDeals

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out